<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - LAPORIN</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .page-header { padding: 40px 0 20px; }
        .page-header h1 { font-size: 2rem; margin-bottom: 8px; }
        .page-header p { color: var(--text-muted); }
        
        .admin-grid { display: flex; flex-direction: column; gap: 20px; margin-bottom: 60px; }
        
        /* Card Desain Baru */
        .admin-card {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 24px;
        }
        .admin-card:hover { border-color: var(--emerald); box-shadow: var(--shadow-sm); }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-title { font-size: 1.3rem; color: var(--navy); }
        .card-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
        .card-desc { font-size: 0.95rem; background: var(--bg-warm); padding: 12px; border-radius: var(--radius-md); margin-bottom: 20px; }
        
        .action-area {
            display: flex;
            gap: 12px;
            align-items: center;
            border-top: 1px solid var(--border-light);
            padding-top: 16px;
            flex-wrap: wrap;
        }
        
        .status-select {
            padding: 10px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            font-family: var(--font-body);
            font-size: 0.95rem;
            flex: 1;
            min-width: 150px;
            background: var(--surface);
            color: var(--text-main);
            outline: none;
        }
        .status-select:focus { border-color: var(--emerald); }
        
        .btn-update { padding: 10px 20px; font-size: 0.95rem; }
        
        @media (max-width: 768px) {
            .action-area { flex-direction: column; align-items: stretch; }
            .status-select { width: 100%; margin-bottom: 10px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo">
                <span class="logo-dot"></span> LAPORIN
            </a>
            <nav class="nav-links" id="navbarLinks">
                <a href="index.html" class="nav-link">Beranda</a>
                <a href="map.html" class="nav-link">Peta</a>
                <a href="admin.html" class="nav-link active">Admin</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>Dashboard Administrator</h1>
            <p>Kelola dan verifikasi semua laporan yang masuk dari masyarakat.</p>
        </div>

        <div class="admin-grid" id="adminList">
            <p class="text-muted text-center" style="padding: 40px 0;">Memuat data laporan...</p>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('access_token');
        const isAdmin = localStorage.getItem('is_admin');
        const navbarLinks = document.getElementById('navbarLinks');

        if (!token || isAdmin !== 'true') {
            alert('Akses Ditolak! Halaman ini hanya untuk Administrator.');
            window.location.href = 'index.html';
        }

        navbarLinks.innerHTML += `
            <a href="my-reports.html" class="nav-link">Laporan Saya</a>
            <a href="#" class="nav-link" style="color: #EF4444;" onclick="logout()">Keluar</a>
        `;

        function logout() {
            if (confirm('Yakin ingin keluar?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('is_admin');
                window.location.href = 'index.html';
            }
        }

        // Fetch All Reports
        async function fetchAdminReports() {
            const adminList = document.getElementById('adminList');
            try {
                const response = await fetch('http://localhost:8000/reports', {
                    method: 'GET'
                });
                const data = await response.json();

                if (data.length === 0) {
                    adminList.innerHTML = `<p class="text-center">Belum ada laporan masuk.</p>`;
                    return;
                }

                let html = '';
                data.forEach(laporan => {
                    const date = new Date(laporan.created_at).toLocaleDateString('id-ID', {
                        day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    const statusOptions = ["Menunggu verifikasi", "Diterima", "Dalam proses", "Selesai", "Ditolak"];
                    let options = '';
                    statusOptions.forEach(s => {
                        options += `<option value="${s}" ${laporan.status === s ? 'selected' : ''}>${s}</option>`;
                    });

                    html += `
                        <div class="admin-card">
                            <div class="card-top">
                                <h3 class="card-title">${laporan.judul}</h3>
                                <span style="font-size: 0.8rem; background: var(--navy); color: white; padding: 4px 10px; border-radius: 50px;">ID: ${laporan.id}</span>
                            </div>
                            <div class="card-meta">
                                <strong>Pelapor ID:</strong> ${laporan.owner_id} | <strong>Kategori:</strong> ${laporan.kategori} | <strong>Tanggal:</strong> ${date}
                            </div>
                            <div class="card-desc">
                                <strong>Lokasi:</strong> ${laporan.lokasi}<br>
                                <strong>Deskripsi:</strong> ${laporan.deskripsi}
                            </div>
                            <div class="action-area">
                                <select id="status-${laporan.id}" class="status-select">
                                    ${options}
                                </select>
                                <button class="btn btn-primary btn-update" onclick="updateStatus(${laporan.id})">Simpan Status</button>
                            </div>
                        </div>
                    `;
                });
                adminList.innerHTML = html;
            } catch (error) {
                adminList.innerHTML = `<p style="color: red;" class="text-center">Gagal memuat data. Pastikan server Termux menyala.</p>`;
            }
        }

        // Update Status
        async function updateStatus(reportId) {
            const newStatus = document.getElementById(`status-${reportId}`).value;
            try {
                const response = await fetch(`http://localhost:8000/reports/${reportId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                if (response.ok) {
                    alert('Status berhasil diperbarui!');
                } else {
                    const data = await response.json();
                    alert('Gagal: ' + data.detail);
                }
            } catch (error) {
                alert('Gagal terhubung ke server.');
            }
        }

        fetchAdminReports();
    </script>
</body>
</html>
