<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - LAPORIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .admin-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .admin-header {
            margin-bottom: 30px;
        }
        .report-card {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border-left: 5px solid var(--primary-color);
        }
        .report-card h3 {
            margin-bottom: 5px;
            font-size: 1.2rem;
        }
        .report-meta {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }
        .report-desc {
            font-size: 0.95rem;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
        }
        .action-area {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }
        .status-select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-family: inherit;
            font-size: 0.9rem;
            flex: 1;
            min-width: 150px;
        }
        .btn-update {
            padding: 8px 16px;
            font-size: 0.9rem;
        }
        .btn-danger {
            background-color: #dc2626;
            color: white;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo">LAPOR<span class="text-primary">IN</span></a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">Beranda</a>
                <a href="map.html" class="nav-link">Peta</a>
                <a href="admin.html" class="nav-link" style="color: var(--primary-color); font-weight: 700;">Dashboard Admin</a>
                <a href="#" class="nav-link" style="color: #dc2626; font-weight: 700;" onclick="logout()">Keluar</a>
            </nav>
        </div>
    </header>

    <main class="admin-container">
        <div class="admin-header">
            <h1 style="font-size: 1.8rem; color: var(--text-main);">Dashboard Administrator</h1>
            <p style="color: var(--text-muted);">Kelola semua laporan yang masuk dari masyarakat.</p>
        </div>

        <!-- Tempat menaruh daftar laporan -->
        <div id="adminReportsList">
            <p style="text-align: center; color: var(--text-muted);">Memuat data...</p>
        </div>
    </main>

    <script>
        // 1. Cek Token dan Status Admin
        const token = localStorage.getItem('access_token');
        const isAdmin = localStorage.getItem('is_admin');

        // Jika tidak ada token, atau bukan admin, tendang keluar!
        if (!token || isAdmin !== 'true') {
            alert('Akses Ditolak! Halaman ini hanya untuk Administrator.');
            window.location.href = 'index.html';
        }

        // 2. Fungsi Logout
        function logout() {
            if (confirm('Apakah Anda yakin ingin keluar?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('is_admin');
                window.location.href = 'index.html';
            }
        }

        // 3. Ambil semua data laporan dari backend
        async function fetchAllReports() {
            const reportsList = document.getElementById('adminReportsList');
            
            try {
                const response = await fetch('https://laporin-production-7ee5268f.up.railway.app/reports', {
                    method: 'GET'
                });

                const data = await response.json();

                if (data.length === 0) {
                    reportsList.innerHTML = `<p style="text-align: center;">Belum ada laporan yang masuk.</p>`;
                    return;
                }

                let htmlContent = '';
                data.forEach(laporan => {
                    const tanggal = new Date(laporan.created_at).toLocaleDateString('id-ID', {
                        day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    // Opsi dropdown status
                    const statusOptions = ["Menunggu verifikasi", "Diterima", "Dalam proses", "Selesai", "Ditolak"];
                    let optionsHtml = '';
                    statusOptions.forEach(status => {
                        const selected = (laporan.status === status) ? 'selected' : '';
                        optionsHtml += `<option value="${status}" ${selected}>${status}</option>`;
                    });

                    htmlContent += `
                        <div class="report-card">
                            <h3>${laporan.judul}</h3>
                            <div class="report-meta">
                                <strong>Pelapor ID:</strong> ${laporan.owner_id} | <strong>Kategori:</strong> ${laporan.kategori} | <strong>Tanggal:</strong> ${tanggal}
                            </div>
                            <div class="report-desc">
                                <strong>Lokasi:</strong> ${laporan.lokasi}<br>
                                <strong>Deskripsi:</strong> ${laporan.deskripsi}
                            </div>
                            
                            <div class="action-area">
                                <label style="font-size: 0.9rem; font-weight: 600;">Ubah Status:</label>
                                <select id="status-${laporan.id}" class="status-select">
                                    ${optionsHtml}
                                </select>
                                <button class="btn btn-primary btn-update" onclick="updateStatus(${laporan.id})">Simpan</button>
                            </div>
                        </div>
                    `;
                });

                reportsList.innerHTML = htmlContent;

            } catch (error) {
                reportsList.innerHTML = `<p style="color: red; text-align: center;">Gagal memuat data. Pastikan server Termux menyala.</p>`;
            }
        }

        // 4. Fungsi untuk mengubah status laporan
        async function updateStatus(reportId) {
            const newStatus = document.getElementById(`status-${reportId}`).value;
            
            try {
                const response = await fetch(`https://laporin-production-7ee5268f.up.railway.app/reports/${reportId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (response.ok) {
                    alert('Status laporan berhasil diperbarui!');
                } else {
                    const data = await response.json();
                    alert('Gagal update: ' + data.detail);
                }
            } catch (error) {
                alert('Gagal terhubung ke server.');
            }
        }

        // Panggil fungsi saat halaman dimuat
        fetchAllReports();
    </script>
</body>
</html>
