<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - LAPORIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="laporin.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <a href="index.html" class="logo">LAPOR<span class="text-primary">IN</span></a>
            <div class="sidebar-nav">
                <div class="sidebar-label">Menu Administrator</div>
                <a href="admin.html" class="sidebar-link active">Semua Laporan</a>
                <a href="#" class="sidebar-link" onclick="logout()" style="color: #FCA5A5; margin-top: 20px;">Keluar</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="sidebar-toggle" id="sidebarToggle"><span></span></button>
                    <h1 class="page-title">Manajemen Laporan</h1>
                </div>
                <div class="badge badge-primary">Mode Admin</div>
            </header>

            <div class="page-body">
                <div class="card" style="padding: 0; overflow: hidden;">
                    <div style="padding: 20px; border-bottom: 1px solid var(--border);">
                        <h2 style="font-size: 1.1rem;">Daftar Semua Laporan Masuk</h2>
                    </div>
                    
                    <div id="loadingState" style="padding: 40px; text-align: center; color: var(--muted);">Memuat data...</div>
                    <div id="errorState" class="empty-state hidden">
                        <h3>Akses Ditolak</h3>
                        <p>Anda tidak memiliki hak akses sebagai Administrator.</p>
                    </div>

                    <div class="table-wrap hidden" id="tableWrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Tiket</th>
                                    <th>Judul</th>
                                    <th>Pelapor</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="adminReportList"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <script>
        const API_BASE_URL = 'https://laporin-production-7ee5268f.up.railway.app';
        const token = localStorage.getItem('token');

        if (!token) {
            alert('Sesi berakhir, silakan login.');
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }

        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebarBackdrop');
        document.getElementById('sidebarToggle').addEventListener('click', () => {
            sidebar.classList.add('open'); backdrop.classList.add('open');
        });
        backdrop.addEventListener('click', () => {
            sidebar.classList.remove('open'); backdrop.classList.remove('open');
        });

        async function fetchAdminReports() {
            try {
                const response = await fetch(`${API_BASE_URL}/admin/reports`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                document.getElementById('loadingState').classList.add('hidden');

                if (response.status === 403 || response.status === 401) {
                    document.getElementById('errorState').classList.remove('hidden');
                    return;
                }

                const reports = await response.json();
                document.getElementById('tableWrapper').classList.remove('hidden');
                const tbody = document.getElementById('adminReportList');
                tbody.innerHTML = '';

                if (reports.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">Belum ada laporan masuk.</td></tr>';
                    return;
                }

                reports.forEach(report => {
                    // Fallback jika tiket masih null
                    const tiket = report.ticket_number ? report.ticket_number : `LPR-2026-${String(report.id).padStart(5, '0')}`;
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: 600; color: var(--primary);">${tiket}</td>
                        <td>${report.judul}</td>
                        <td>${report.pemilik ? report.pemilik.nama_lengkap : 'Anonim'}</td>
                        <td>
                            <select onchange="updateStatus(${report.id}, this.value)" class="btn btn-sm btn-outline">
                                <option value="Menunggu verifikasi" ${report.status === 'Menunggu verifikasi' ? 'selected' : ''}>Menunggu</option>
                                <option value="Diproses" ${report.status === 'Diproses' ? 'selected' : ''}>Diproses</option>
                                <option value="Selesai" ${report.status === 'Selesai' ? 'selected' : ''}>Selesai</option>
                                <option value="Ditolak" ${report.status === 'Ditolak' ? 'selected' : ''}>Ditolak</option>
                            </select>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="alert('Detail laporan bisa dilihat di menu Lacak')">Detail</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                document.getElementById('loadingState').innerText = 'Gagal terhubung ke server.';
                console.error(error);
            }
        }

        async function updateStatus(reportId, newStatus) {
            const formData = new URLSearchParams();
            formData.append('status', newStatus);
            formData.append('note', `Status diubah oleh Admin menjadi ${newStatus}`);

            try {
                const response = await fetch(`${API_BASE_URL}/admin/reports/${reportId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });
                if (response.ok) {
                    alert('Status berhasil diperbarui!');
                } else {
                    alert('Gagal mengubah status.');
                }
            } catch (error) {
                alert('Terjadi kesalahan jaringan.');
            }
        }

        fetchAdminReports();
    </script>
</body>
</html>
