<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - LAPORIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="laporin.css">
</head>
<body class="auth-body">
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo">LAPOR<span class="text-primary">IN</span></a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Selamat Datang Kembali</h1>
                <p>Masuk untuk memantau laporan Anda</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label>Alamat Email</label>
                    <input type="email" id="email" required placeholder="nama@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Masukkan password Anda">
                </div>
                <button type="submit" id="loginBtn" class="btn btn-primary btn-block" style="margin-top: 10px;">Masuk</button>
            </form>

            <div class="auth-footer">
                Belum punya akun? <a href="register.html">Daftar sekarang</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://url-railway-anda.up.railway.app';

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = 'Memproses...';
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const formData = new URLSearchParams();
            formData.append('username', email); 
            formData.append('password', password);

            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user_email', email);
                    alert('Login Berhasil!');
                    window.location.href = 'my-reports.html'; 
                } else {
                    const err = await response.json();
                    alert('Gagal Login: ' + (err.detail || 'Email atau password salah'));
                }
            } catch (error) {
                alert('Gagal terhubung ke server backend.');
            } finally {
                btn.innerHTML = 'Masuk';
                btn.disabled = false;
            }
        });
    </script>
</body>
  </html>
