<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - LAPORIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* CSS Split-Screen */
        .auth-split {
            display: flex;
            min-height: 100vh;
            background: var(--bg-warm);
        }
        
        .auth-left {
            flex: 1;
            background-color: var(--navy);
            color: var(--surface);
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Pattern dekoratif di kiri */
        .auth-left::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--emerald);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            opacity: 0.2;
            filter: blur(40px);
        }

        .auth-left h1 {
            color: var(--surface);
            font-size: 3rem;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .auth-left p {
            color: #94A3B8;
            font-size: 1.1rem;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }

        .auth-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .auth-form-container {
            width: 100%;
            max-width: 420px;
        }

        .auth-header {
            margin-bottom: 32px;
        }

        .auth-header h2 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-muted);
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--emerald);
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .auth-split {
                flex-direction: column;
            }
            .auth-left {
                padding: 40px 24px;
                text-align: center;
                align-items: center;
            }
            .auth-left h1 { font-size: 2rem; }
            .auth-right { padding: 40px 24px; }
        }
    </style>
</head>
<body>

    <div class="auth-split">
        <!-- SISI KIRI: BRANDING -->
        <div class="auth-left">
            <a href="index.html" class="logo" style="color: white; margin-bottom: 40px; text-decoration: none;">
                <span class="logo-dot"></span> LAPORIN
            </a>
            <h1>Bersama, Kita Wujudkan Perubahan.</h1>
            <p>Masuk ke akun Anda untuk mulai melaporkan permasalahan di sekitar dan pantau tindak lanjutnya secara transparan.</p>
        </div>

        <!-- SISI KANAN: FORM LOGIN -->
        <div class="auth-right">
            <div class="auth-form-container">
                <div class="auth-header">
                    <h2>Selamat Datang Kembali</h2>
                    <p>Silakan masuk untuk melanjutkan pelaporan Anda.</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Alamat Email</label>
                        <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Kata Sandi</label>
                        <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" required>
                    </div>

                    <p id="pesanError" style="color: red; font-size: 0.9rem; display: none;"></p>

                    <button type="submit" class="btn btn-primary btn-block">Masuk</button>
                </form>

                <div class="auth-footer">
                    <p>Belum punya akun? <a href="register.html">Daftar di sini</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const pesanError = document.getElementById('pesanError');
            const btnSubmit = document.querySelector('button[type="submit"]');

            const formData = new URLSearchParams();
            formData.append('username', email); 
            formData.append('password', password);

            // Tambahkan loading state pada tombol
            btnSubmit.innerText = 'Memproses...';
            btnSubmit.disabled = true;
            pesanError.style.display = 'none';

            try {
                // PENTING: Ganti URL ini jika backend sudah online
                const response = await fetch('http://localhost:8000/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    const payload = JSON.parse(atob(data.access_token.split('.')[1]));
                    localStorage.setItem('is_admin', payload.is_admin);

                    alert('Login Berhasil!');
                    if (payload.is_admin) {
                        window.location.href = 'admin.html'; 
                    } else {
                        window.location.href = 'map.html'; 
                    }
                } else {
                    pesanError.style.display = 'block';
                    pesanError.innerText = data.detail || 'Email atau password salah';
                }
            } catch (error) {
                pesanError.style.display = 'block';
                pesanError.innerText = 'Gagal terhubung ke server. Pastikan Termux menyala.';
            } finally {
                btnSubmit.innerText = 'Masuk';
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
