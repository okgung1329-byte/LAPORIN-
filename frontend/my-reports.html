<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Saya - LAPORIN</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .page-header {
            padding: 40px 0 20px;
        }
        
        .page-header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-muted);
        }

        .report-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 60px;
        }

        /* Desain Kartu Laporan Baru */
        .report-card {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 24px;
            transition: all 0.3s ease;
        }

        .report-card:hover {
            box-shadow: var(--shadow-sm);
            border-color: var(--emerald);
        }

        .report-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .report-title {
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: var(--navy);
        }

        .report-info {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .report-info span {
            margin-right: 16px;
        }

        .report-desc {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .report-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-light);
            padding-top: 16px;
        }

        .report-date {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 700;
        }

        .status-wait { background: #FEF3C7; color: #D97706; }
        .status-process { background: #DBEAFE; color: #2563EB; }
        .status-done { background: #D1FAE5; color: #059669; }
        .status-reject { background: #FEE2E2; color: #DC2626; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--surface);
            border: 1px dashed var(--border-light);
            border-radius: var(--radius-lg);
        }

        @media (max-width: 768px) {
            .report-meta { flex-direction: column; gap: 8px; }
            .report-footer { flex-direction: column; align-items: flex-start; gap: 12px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo">
                <span class="logo-dot"></span> LAPORIN
            </a>
            <nav class="nav-links" id="navbarLinks">
                <a href="index.html" class="nav-link">Beranda</a>
                <a href="map.html" class="nav-link">Peta Laporan</a>
                <a href="create_report.html" class="nav-link">Buat Laporan</a>
                <a href="my-reports.html" class="nav-link active">Laporan Saya</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>Laporan Saya</h1>
            <p>Daftar permasalahan yang telah Anda laporkan.</p>
        </div>

        <div class="report-list" id="reportsList">
            <p class="text-muted text-center" style="padding: 40px 0;">Memuat data...</p>
        </div>
    </main>

    <script>
        // --- 1. LOGIKA NAVBAR DINAMIS ---
        const token = localStorage.getItem('access_token');
        const isAdmin = localStorage.getItem('is_admin');
        const navbarLinks = document.getElementById('navbarLinks');

        if (!token) {
            alert('Anda harus login untuk melihat halaman ini!');
            window.location.href = 'login.html';
        }

        let adminMenu = isAdmin === 'true' ? `<a href="admin.html" class="nav-link">Dashboard</a>` : '';
        navbarLinks.innerHTML += `
            ${adminMenu}
            <a href="#" class="nav-link" style="color: #EF4444;" onclick="logout()">Keluar</a>
        `;

        function logout() {
            if (confirm('Apakah Anda yakin ingin keluar?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('is_admin');
                window.location.href = 'index.html';
            }
        }

        // --- 2. AMBIL DATA LAPORAN ---
        async function fetchMyReports() {
            const reportsList = document.getElementById('reportsList');
            
            try {
                // Ganti URL ini jika backend sudah online
                const response = await fetch('http://localhost:8000/my-reports', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) {
                    alert('Sesi berakhir. Silakan login kembali.');
                    localStorage.removeItem('access_token');
                    window.location.href = 'login.html';
                    return;
                }

                const data = await response.json();

                if (data.length === 0) {
                    reportsList.innerHTML = `
                        <div class="empty-state">
                            <h3 style="margin-bottom: 12px; color: var(--navy);">Belum Ada Laporan</h3>
                            <p class="text-muted" style="margin-bottom: 24px;">Anda belum pernah membuat laporan. Mari mulai laporkan permasalahan di sekitar Anda.</p>
                            <a href="create_report.html" class="btn btn-primary">Buat Laporan Pertama</a>
                        </div>
                    `;
                    return;
                }

                let htmlContent = '';
                data.forEach(laporan => {
                    let badgeClass = 'status-wait';
                    if (laporan.status === 'Dalam proses' || laporan.status === 'Diterima') badgeClass = 'status-process';
                    if (laporan.status === 'Selesai') badgeClass = 'status-done';
                    if (laporan.status === 'Ditolak') badgeClass = 'status-reject';

                    const tanggal = new Date(laporan.created_at).toLocaleDateString('id-ID', {
                        day: 'numeric', month: 'long', year: 'numeric'
                    });

                    htmlContent += `
                        <div class="report-card">
                            <div class="report-meta">
                                <h3 class="report-title">${laporan.judul}</h3>
                                <span class="status-badge ${badgeClass}">${laporan.status}</span>
                            </div>
                            <div class="report-info">
                                <span>📁 ${laporan.kategori}</span>
                                <span>📍 ${laporan.lokasi}</span>
                            </div>
                            <p class="report-desc">${laporan.deskripsi}</p>
                            <div class="report-footer">
                                <span class="report-date">Dilaporkan pada: ${tanggal}</span>
                            </div>
                        </div>
                    `;
                });

                reportsList.innerHTML = htmlContent;

            } catch (error) {
                reportsList.innerHTML = `
                    <div class="empty-state">
                        <p style="color: var(--status-reject);">Gagal memuat data. Pastikan server backend (Termux) menyala.</p>
                    </div>
                `;
            }
        }

        fetchMyReports();
    </script>
</body>
</html>
