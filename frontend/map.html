<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Peta Laporan - LAPORIN</title>
    
    <!-- Fonts & CSS Utama -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- Library Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* Penyesuaian peta agar pas di bawah navbar */
        .map-wrapper {
            height: calc(100vh - 80px);
            width: 100%;
            position: relative;
        }

        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
        }

        /* Styling untuk Popup Leaflet agar sesuai dengan desain kita */
        .leaflet-popup-content-wrapper {
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            font-family: var(--font-body);
        }
        .leaflet-popup-content {
            margin: 16px;
        }
        .popup-title {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--navy);
            margin-bottom: 8px;
        }
        .popup-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .popup-desc {
            font-size: 0.9rem;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        /* Floating Action Button (FAB) */
        .fab-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }

        @media (max-width: 768px) {
            .map-wrapper {
                height: calc(100vh - 70px);
            }
            .fab-container {
                bottom: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR BARU -->
    <header class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo">
                <span class="logo-dot"></span> LAPORIN
            </a>
            <nav class="nav-links" id="navbarLinks">
                <a href="index.html" class="nav-link">Beranda</a>
                <a href="map.html" class="nav-link active">Peta Laporan</a>
                <a href="create_report.html" class="nav-link">Buat Laporan</a>
            </nav>
        </div>
    </header>

    <!-- AREA PETA -->
    <main class="map-wrapper">
        <div id="map"></div>
        
        <!-- Tombol Melayang untuk Buat Laporan -->
        <div class="fab-container" id="fabButton" style="display: none;">
            <a href="create_report.html" class="btn btn-primary" style="border-radius: 50px; padding: 16px 24px; box-shadow: var(--shadow-lg);">
                + Buat Laporan
            </a>
        </div>
    </main>

    <script>
        // --- 1. LOGIKA NAVBAR DINAMIS ---
        const token = localStorage.getItem('access_token');
        const isAdmin = localStorage.getItem('is_admin');
        const navbarLinks = document.getElementById('navbarLinks');
        const fabButton = document.getElementById('fabButton');

        if (token) {
            // Tampilkan tombol FAB jika sudah login
            fabButton.style.display = 'block';
            
            // Tambahkan menu Laporan Saya & Keluar
            let adminMenu = isAdmin === 'true' ? `<a href="admin.html" class="nav-link">Dashboard</a>` : '';
            navbarLinks.innerHTML += `
                <a href="my-reports.html" class="nav-link">Laporan Saya</a>
                ${adminMenu}
                <a href="#" class="nav-link" style="color: #EF4444;" onclick="logout()">Keluar</a>
            `;
        } else {
            // Jika belum login
            navbarLinks.innerHTML += `
                <a href="login.html" class="nav-link" style="color: var(--emerald); font-weight: 700;">Masuk</a>
            `;
        }

        function logout() {
            if (confirm('Apakah Anda yakin ingin keluar?')) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('is_admin');
                window.location.href = 'index.html';
            }
        }

        // --- 2. INISIALISASI PETA ---
        var map = L.map('map').setView([-2.548926, 118.0148634], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // --- 3. AMBIL DATA & TAMPILKAN MARKER ---
        // Pastikan URL ini sesuai dengan backend Anda
        const API_BASE_URL = 'http://localhost:8000';

        async function fetchMapReports() {
            try {
                const response = await fetch(`${API_BASE_URL}/reports`);
                if (!response.ok) throw new Error('Gagal mengambil data');
                
                const data = await response.json();

                data.forEach(laporan => {
                    if (laporan.latitude && laporan.longitude) {
                        // Tentukan warna marker berdasarkan status
                        let markerColor = '#F59E0B'; // Default Kuning (Menunggu)
                        if (laporan.status === 'Dalam proses' || laporan.status === 'Diterima') markerColor = '#3B82F6'; // Biru
                        if (laporan.status === 'Selesai') markerColor = '#10B981'; // Hijau
                        if (laporan.status === 'Ditolak') markerColor = '#EF4444'; // Merah

                        // Custom Marker Icon (SVG)
                        var customIcon = L.divIcon({
                            className: 'custom-div-icon',
                            html: `<div style="background-color: ${markerColor}; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>`,
                            iconSize: [20, 20],
                            iconAnchor: [10, 10]
                        });

                        var marker = L.marker([laporan.latitude, laporan.longitude], { icon: customIcon }).addTo(map);
                        
                        // Konten Popup dengan styling baru
                        var popupContent = `
                            <div>
                                <div class="popup-title">${laporan.judul}</div>
                                <div class="popup-meta">
                                    <strong>${laporan.kategori}</strong> &bull; ${laporan.lokasi}
                                </div>
                                <div class="popup-desc">${laporan.deskripsi}</div>
                                <span class="report-status status-wait" style="margin-top: 0;">${laporan.status}</span>
                            </div>
                        `;
                        
                        marker.bindPopup(popupContent);
                    }
                });
            } catch (error) {
                console.error('Error fetching map data:', error);
                alert('Gagal memuat data peta. Pastikan server backend menyala.');
            }
        }

        // Panggil fungsi fetch
        fetchMapReports();

    </script>
</body>
</html>
