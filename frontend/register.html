<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - LAPORIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

    <header class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo">LAPOR<span class="text-primary">IN</span></a>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Buat Akun Baru</h1>
                <p>Bergabunglah untuk mulai membuat laporan.</p>
            </div>

            <!-- Tambahkan id="registerForm" -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" name="password" placeholder="Buat kata sandi (min. 8 karakter)" required minlength="8">
                </div>

                <div class="form-group">
                    <label for="konfirmasi_password">Konfirmasi Kata Sandi</label>
                    <input type="password" id="konfirmasi_password" name="konfirmasi_password" placeholder="Ulangi kata sandi" required minlength="8">
                </div>

                <!-- Tempat menampilkan pesan error -->
                <p id="pesanError" style="color: red; font-size: 0.9rem; display: none;"></p>

                <button type="submit" class="btn btn-primary btn-block">Daftar Sekarang</button>
            </form>

            <div class="auth-footer">
                <p>Sudah punya akun? <a href="login.html" class="text-primary">Masuk di sini</a></p>
            </div>
        </div>
    </main>

    <!-- SCRIPT UNTUK REGISTER -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const nama = document.getElementById('nama').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const konfirmasi_password = document.getElementById('konfirmasi_password').value;
            const pesanError = document.getElementById('pesanError');

            // Validasi apakah password dan konfirmasi cocok
            if (password !== konfirmasi_password) {
                pesanError.style.display = 'block';
                pesanError.innerText = 'Kata sandi dan konfirmasi tidak cocok!';
                return;
            }

            // Sembunyikan pesan error sebelumnya
            pesanError.style.display = 'none';

            try {
                // Kirim data ke backend (format JSON)
                const response = await fetch('http://localhost:8000/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nama_lengkap: nama,
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Jika berhasil (201 Created)
                    alert('Pendaftaran Berhasil! Silakan Login.');
                    window.location.href = 'login.html'; // Arahkan ke halaman login
                } else {
                    // Jika gagal (misal email sudah terdaftar)
                    pesanError.style.display = 'block';
                    pesanError.innerText = data.detail || 'Terjadi kesalahan saat mendaftar.';
                }
            } catch (error) {
                pesanError.style.display = 'block';
                pesanError.innerText = 'Gagal terhubung ke server. Pastikan Termux menyala.';
            }
        });
    </script>
</body>
</html>
