<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - LAPORIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="laporin.css">
</head>
<body class="auth-body">
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo">LAPOR<span class="text-primary">IN</span></a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Buat Akun Baru</h1>
                <p>Bergabunglah untuk mulai melapor</p>
            </div>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="nama" required placeholder="Sesuai KTP">
                </div>
                <div class="form-group">
                    <label>Alamat Email</label>
                    <input type="email" id="email" required placeholder="nama@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Buat password yang kuat">
                </div>
                <button type="submit" id="registerBtn" class="btn btn-primary btn-block" style="margin-top: 10px;">Daftar Sekarang</button>
            </form>

            <div class="auth-footer">
                Sudah punya akun? <a href="login.html">Masuk di sini</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://url-railway-anda.up.railway.app';

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            btn.innerHTML = 'Memproses...';
            btn.disabled = true;

            const data = {
                nama_lengkap: document.getElementById('nama').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert('Pendaftaran berhasil! Silakan login.');
                    window.location.href = 'login.html';
                } else {
                    const err = await response.json();
                    alert('Gagal Daftar: ' + (err.detail || 'Email sudah digunakan'));
                }
            } catch (error) {
                alert('Gagal terhubung ke server backend.');
            } finally {
                btn.innerHTML = 'Daftar Sekarang';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
