<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Laporan - LAPORIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="laporin.css">
    <style>
        .form-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .form-card { background: var(--white); padding: 30px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); }
        #map { height: 300px; border-radius: var(--radius-sm); margin-top: 8px; border: 1px solid var(--border); z-index: 1; }
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) { .grid-form { grid-template-columns: 1fr; } }
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-content { background: var(--white); padding: 30px; border-radius: var(--radius); text-align: center; max-width: 400px; width: 100%; box-shadow: var(--shadow-lg); }
        .modal-content h2 { color: var(--success); margin-bottom: 10px; }
        .ticket-box { background: var(--primary-soft); color: var(--primary-dark); font-size: 1.5rem; font-weight: 800; padding: 15px; border-radius: 10px; margin: 20px 0; letter-spacing: 1px; border: 2px dashed var(--primary); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo">LAPOR<span class="text-primary">IN</span></a>
            <a href="my-reports.html" class="btn btn-outline btn-sm">Kembali ke Dashboard</a>
        </div>
    </nav>

    <div class="form-container">
        <div class="form-card">
            <h1 class="page-title" style="margin-bottom: 8px;">Buat Laporan Baru</h1>
            <p class="page-subtitle" style="margin-bottom: 24px;">Sampaikan permasalahan di sekitar Anda dengan detail dan bukti yang jelas.</p>

            <form id="reportForm" class="auth-form">
                <div class="form-group">
                    <label>Judul Laporan</label>
                    <input type="text" id="judul" required placeholder="Contoh: Jalan Berlubang di depan SDN 01">
                </div>

                <div class="grid-form">
                    <div class="form-group">
                        <label>Kategori</label>
                        <select id="kategori" required>
                            <option value="">-- Pilih Kategori --</option>
                            <option value="Infrastruktur">Infrastruktur</option>
                            <option value="Kebersihan">Kebersihan</option>
                            <option value="Keamanan">Keamanan</option>
                            <option value="Pelayanan Publik">Pelayanan Publik</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Foto Bukti (Opsional)</label>
                        <input type="file" id="foto" accept="image/*">
                    </div>
                </div>

                <div class="form-group">
                    <label>Deskripsi Masalah</label>
                    <textarea id="deskripsi" required placeholder="Jelaskan detail permasalahan yang terjadi..."></textarea>
                </div>

                <div class="form-group">
                    <label>Alamat Kejadian</label>
                    <input type="text" id="lokasi" required placeholder="Nama jalan, RT/RW, atau patokan lokasi">
                </div>

                <div class="form-group">
                    <label>Pilih Titik Lokasi di Peta</label>
                    <div id="map"></div>
                    <div class="grid-form" style="margin-top: 8px;">
                        <input type="text" id="latitude" readonly placeholder="Latitude">
                        <input type="text" id="longitude" readonly placeholder="Longitude">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary btn-block" style="margin-top: 10px;">Kirim Laporan</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <h2>Laporan Terkirim!</h2>
            <p>Simpan nomor tiket ini untuk melacak laporan Anda.</p>
            <div class="ticket-box" id="ticketNumber">LPR-XXXX-XXXXX</div>
            <button class="btn btn-primary btn-block" onclick="window.location.href='my-reports.html'">Lihat Laporan Saya</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_BASE_URL = 'https://laporin-production-7ee5268f.up.railway.app';
        const token = localStorage.getItem('token');
        
        if (!token) {
            alert('Anda harus login terlebih dahulu!');
            window.location.href = 'login.html';
        }

        const map = L.map('map').setView([-6.200000, 106.816666], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let marker;
        map.on('click', function(e) {
            const lat = e.latlng.lat.toFixed(6);
            const lng = e.latlng.lng.toFixed(6);
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lng;
            if (marker) { marker.setLatLng(e.latlng); } else { marker = L.marker(e.latlng).addTo(map); }
        });

        document.getElementById('reportForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = 'Mengirim...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('judul', document.getElementById('judul').value);
            formData.append('kategori', document.getElementById('kategori').value);
            formData.append('deskripsi', document.getElementById('deskripsi').value);
            formData.append('lokasi', document.getElementById('lokasi').value);
            
            const lat = document.getElementById('latitude').value;
            const lng = document.getElementById('longitude').value;
            if(lat) formData.append('latitude', lat);
            if(lng) formData.append('longitude', lng);

            const fileInput = document.getElementById('foto');
            if (fileInput.files.length > 0) { formData.append('foto', fileInput.files[0]); }

            try {
                const response = await fetch(`${API_BASE_URL}/reports`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('ticketNumber').innerText = data.ticket_number;
                    document.getElementById('successModal').style.display = 'flex';
                } else {
                    const errText = await response.text();
                    alert('Server Error ' + response.status + ': ' + errText);
                }
            } catch (error) {
                alert('Jaringan Error: ' + error.message + ' | Token: ' + (token ? 'Ada' : 'Kosong'));
            } finally {
                btn.innerHTML = 'Kirim Laporan';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
