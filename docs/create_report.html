<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Laporan - LAPORIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        .report-container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .report-card { background: var(--white); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        textarea.form-control { padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; font-family: inherit; outline: none; resize: vertical; min-height: 100px; width: 100%; box-sizing: border-box; }
        textarea.form-control:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .input-group-flex { display: flex; gap: 10px; }
        .input-group-flex .form-group { flex: 1; min-width: 0; }
        .input-group-flex input { width: 100%; box-sizing: border-box; }
        input[type="file"] { padding: 10px; border: 1px dashed var(--primary-color); background-color: #eff6ff; border-radius: 8px; width: 100%; box-sizing: border-box; }
        
        #map-picker { height: 250px; width: 100%; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 10px; z-index: 1; }
        .input-readonly { background-color: #f1f5f9; cursor: not-allowed; }
        
        /* Tombol GPS */
        .btn-gps {
            background-color: #10b981; /* Hijau */
            color: white;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            padding: 10px 15px;
        }
        .btn-gps:hover { background-color: #059669; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo">LAPOR<span class="text-primary">IN</span></a>
            <nav class="nav-links">
                <a href="index.html" class="nav-link">Beranda</a>
                <a href="map.html" class="nav-link">Peta</a>
                <a href="create_report.html" class="nav-link" style="color: var(--primary-color); font-weight: 700;">Buat Laporan</a>
            </nav>
        </div>
    </header>

    <main class="report-container">
        <div class="report-card">
            <div class="auth-header" style="text-align: left; margin-bottom: 20px;">
                <h1 style="font-size: 1.8rem;">Buat Laporan Baru</h1>
                <p>Sampaikan permasalahan di sekitar Anda dengan detail.</p>
            </div>

            <form id="reportForm" class="auth-form">
                <div class="form-group">
                    <label for="judul">Judul Laporan</label>
                    <input type="text" id="judul" placeholder="Contoh: Jalan Berlubang di Depan SD" required>
                </div>

                <div class="form-group">
                    <label for="kategori">Kategori</label>
                    <select id="kategori" class="form-control" style="padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; font-size: 1rem; width: 100%; box-sizing: border-box;" required>
                        <option value="">-- Pilih Kategori --</option>
                        <option value="Infrastruktur">Infrastruktur</option>
                        <option value="Kebersihan">Kebersihan</option>
                        <option value="Fasilitas Umum">Fasilitas Umum</option>
                        <option value="Lalu Lintas">Lalu Lintas</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="deskripsi">Deskripsi Masalah</label>
                    <textarea id="deskripsi" placeholder="Jelaskan detail permasalahan..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="foto">Foto Pendukung (Opsional)</label>
                    <input type="file" id="foto" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="lokasi">Alamat / Lokasi Kejadian</label>
                    <input type="text" id="lokasi" placeholder="Klik peta atau gunakan lokasi saat ini" required>
                </div>

                <!-- PETA INTERAKTIF & TOMBOL GPS -->
                <div class="form-group">
                    <label>Titik Lokasi di Peta</label>
                    <button type="button" id="btnLokasiSaya" class="btn btn-gps">
                        📍 Gunakan Lokasi Saat Ini
                    </button>
                    <div id="map-picker"></div>
                </div>

                <div class="input-group-flex">
                    <div class="form-group">
                        <label for="latitude">Latitude</label>
                        <input type="text" id="latitude" class="input-readonly" placeholder="Otomatis..." readonly required>
                    </div>
                    <div class="form-group">
                        <label for="longitude">Longitude</label>
                        <input type="text" id="longitude" class="input-readonly" placeholder="Otomatis..." readonly required>
                    </div>
                </div>

                <p id="pesanError" style="color: red; font-size: 0.9rem; display: none;"></p>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">Kirim Laporan</button>
            </form>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('access_token');
        if (!token) {
            alert('Anda harus login terlebih dahulu untuk membuat laporan!');
            window.location.href = 'login.html';
        }

        // --- 1. INISIALISASI PETA ---
        var mapPicker = L.map('map-picker').setView([-2.548926, 118.0148634], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(mapPicker);

        var marker;

        // Fungsi untuk update input dan memindahkan pin
        function updateLocation(lat, lng) {
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lng;

            if (marker) {
                mapPicker.removeLayer(marker);
            }
            marker = L.marker([lat, lng]).addTo(mapPicker);
            mapPicker.setView([lat, lng], 16); // Zoom dekat ke lokasi
        }

        // Event klik peta manual
        mapPicker.on('click', function(e) {
            updateLocation(e.latlng.lat, e.latlng.lng);
            // Kosongkan alamat jika user memilih manual agar mereka mengetik sendiri
            document.getElementById('lokasi').value = ""; 
        });

        // --- 2. FITUR LOKASI SAAT INI (GPS) & REVERSE GEOCODING ---
        document.getElementById('btnLokasiSaya').addEventListener('click', function() {
            const btn = this;
            btn.innerHTML = "⏳ Mencari lokasi...";
            btn.disabled = true;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    // Pindahkan peta dan isi input koordinat
                    updateLocation(lat, lng);

                    // Minta OpenStreetMap menebak nama alamat (Reverse Geocoding)
                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
                        const data = await response.json();
                        
                        // Isi kolom alamat otomatis
                        if (data.display_name) {
                            document.getElementById('lokasi').value = data.display_name;
                        }
                    } catch (error) {
                        console.log("Gagal mengambil alamat, silakan ketik manual.");
                    }

                    btn.innerHTML = "📍 Gunakan Lokasi Saat Ini";
                    btn.disabled = false;
                }, function(error) {
                    alert("Gagal mendapatkan lokasi. Pastikan GPS aktif dan izin browser diberikan.");
                    btn.innerHTML = "📍 Gunakan Lokasi Saat Ini";
                    btn.disabled = false;
                });
            } else {
                alert("Browser Anda tidak mendukung fitur lokasi.");
                btn.innerHTML = "📍 Gunakan Lokasi Saat Ini";
                btn.disabled = false;
            }
        });

        // --- 3. LOGIKA KIRIM FORM ---
        document.getElementById('reportForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const pesanError = document.getElementById('pesanError');
            pesanError.style.display = 'none';

            if (!document.getElementById('latitude').value) {
                pesanError.style.display = 'block';
                pesanError.innerText = 'Silakan tentukan lokasi di peta atau gunakan GPS.';
                return;
            }

            const formData = new FormData();
            formData.append('judul', document.getElementById('judul').value);
            formData.append('kategori', document.getElementById('kategori').value);
            formData.append('deskripsi', document.getElementById('deskripsi').value);
            formData.append('lokasi', document.getElementById('lokasi').value);
            formData.append('latitude', document.getElementById('latitude').value);
            formData.append('longitude', document.getElementById('longitude').value);
            
            const fileFoto = document.getElementById('foto').files[0];
            if (fileFoto) {
                formData.append('foto', fileFoto);
            }

            try {
                const response = await fetch('https://laporin-production-7ee5268f.up.railway.app/reports', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData 
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Laporan berhasil dikirim! Terima kasih.');
                    window.location.href = 'my-reports.html'; 
                } else if (response.status === 401) {
                    alert('Sesi berakhir. Silakan login kembali.');
                    localStorage.removeItem('access_token');
                    window.location.href = 'login.html';
                } else {
                    pesanError.style.display = 'block';
                    pesanError.innerText = data.detail || 'Gagal mengirim laporan.';
                }
            } catch (error) {
                pesanError.style.display = 'block';
                pesanError.innerText = 'Gagal terhubung ke server. Pastikan Termux menyala.';
            }
        });
    </script>
</body>
</html>
